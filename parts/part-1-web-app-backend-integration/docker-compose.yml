version: "3.9"

services:
  backend:
    build: ./backend
    container_name: recon-backend
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Recon Platform API
      - DEBUG=true
      - DATABASE_URL=sqlite:///./recon.db
      - CORS_ORIGINS=["http://localhost:5173","http://localhost:3000","http://localhost:80"]
    volumes:
      - backend-data:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    container_name: recon-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
