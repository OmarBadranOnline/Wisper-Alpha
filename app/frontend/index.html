<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recon Platform</title>
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      #boot-loader {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, #0a1c33, #07111f);
        color: #c4d0e0;
        font-family: "JetBrains Mono", monospace;
        z-index: 9999;
      }
      .boot-card {
        text-align: center;
        border: 1px solid #1a2a42;
        background: rgba(10, 28, 51, 0.8);
        padding: 20px 24px;
        border-radius: 10px;
        min-width: 280px;
      }
      .boot-spin {
        width: 28px;
        height: 28px;
        margin: 0 auto 10px;
        border: 3px solid #2a3e5c;
        border-top-color: #4aafd9;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      .boot-sub {
        margin-top: 6px;
        font-size: 12px;
        opacity: 0.8;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="boot-loader">
      <div class="boot-card">
        <div class="boot-spin"></div>
        <div>Loading Wisper Alpha GUI...</div>
        <div class="boot-sub">Preparing monitoring dashboard</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
